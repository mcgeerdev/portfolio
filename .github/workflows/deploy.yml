name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *" # Daily at 6 AM UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has_commits: ${{ steps.check.outputs.has_commits }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          install: false

      - name: Check for recent commits (scheduled runs only)
        id: check
        if: github.event_name == 'schedule'
        run: |
          RECENT=$(git log --since="24 hours ago" --oneline)
          if [ -z "$RECENT" ]; then
            echo "No commits in last 24h, skipping"
            echo "has_commits=false" >> $GITHUB_OUTPUT
          else
            echo "has_commits=true" >> $GITHUB_OUTPUT
          fi

      - name: Build staged site
        if: github.event_name != 'schedule' || steps.check.outputs.has_commits == 'true'
        run: mise run build:minified

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: github.event_name != 'schedule' || steps.check.outputs.has_commits == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'schedule' || needs.build.outputs.has_commits == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
